<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="#0f172a"/>
  <!-- Outer gear ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="12" stroke-dasharray="28 14"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="20 10"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="120" fill="#1e293b" stroke="#10b981" stroke-width="4"/>
  <!-- Lightning bolt -->
  <polygon points="280,140 200,260 250,260 230,380 330,240 270,240 290,140" fill="#10b981" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="20" fill="#10b981" opacity="0.6"/>
  <!-- 'OW' small text -->
  <text x="256" y="430" text-anchor="middle" fill="#10b981" font-family="'Segoe UI',system-ui,sans-serif" font-size="32" font-weight="700" letter-spacing="8">OW</text>
</svg>
